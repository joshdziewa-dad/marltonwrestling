<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chief Standard — Curriculum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #121110;
    --black-2: #1b1917;
    --card: #201d1a;
    --card-hover: #292420;
    --line: #38322c;
    --orange: #ff7a1a;
    --orange-dim: #a14e10;
    --amber: #ffb347;
    --text: #f2ede4;
    --text-dim: #b6ada0;
    --text-faint: #7a7268;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(255,122,26,0.10), transparent 60%),
      var(--black);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:22px;
    margin-bottom:26px;
    border-bottom:3px solid var(--orange);
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; bottom:-3px;
    width:64px; height:3px;
    background:var(--amber);
  }
  .brand-eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--orange);
    margin:0 0 6px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4.4vw,42px);
    text-transform:uppercase;
    letter-spacing:.01em;
    margin:0;
    line-height:1.02;
  }
  h1 span{color:var(--orange);}
  .header-meta{
    text-align:right;
    color:var(--text-faint);
    font-size:12.5px;
    line-height:1.6;
    white-space:nowrap;
  }

  /* LEVEL TABS (primary) */
  .lvl-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .lvl-tab{
    font-family:'Oswald',sans-serif;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:12px 20px;
    border-radius:3px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-weight:600;
    transition:border-color .15s, color .15s, background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .lvl-tab:hover{border-color:var(--orange-dim); color:var(--text);}
  .lvl-tab.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#1a0e00;
  }

  /* POSITION TABS (secondary, nested) */
  .pos-tabs{
    display:flex;
    gap:6px;
    margin-bottom:26px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .pos-tab{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-weight:600;
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
    color:var(--text-faint);
    border:1px solid var(--line);
    background:transparent;
    transition:all .15s;
  }
  .pos-tab:hover{color:var(--text); border-color:var(--orange-dim);}
  .pos-tab.active{
    color:var(--amber);
    border-color:var(--amber);
    background:rgba(255,179,71,0.08);
  }

  /* CONTENT BLOCKS */
  .pos-block{
    margin-bottom:14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--black-2);
    overflow:hidden;
  }
  .pos-block summary{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
    list-style:none;
    font-family:'Oswald',sans-serif;
    font-size:16px;
    letter-spacing:.03em;
    text-transform:uppercase;
    font-weight:600;
  }
  .pos-block summary::-webkit-details-marker{display:none;}
  .pos-block summary::before{
    content:"\25B8";
    color:var(--text-faint);
    font-size:13px;
    transition:transform .15s;
    display:inline-block;
  }
  .pos-block[open] summary::before{transform:rotate(90deg); color:var(--orange);}
  .pos-block summary:hover{background:rgba(255,122,26,0.05);}
  .pos-block .num{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--black);
    background:var(--orange);
    width:26px;height:26px;
    min-width:26px;
    border-radius:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .pos-block-body{padding:6px 18px 18px 58px;}
  .pos-block-plain{padding:0;}

  .lvl-block-title{
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--orange);
    margin:16px 0 8px;
    padding-bottom:4px;
    border-bottom:1px dashed var(--line);
  }
  .lvl-block-title:first-child{margin-top:0;}

  .principles{
    list-style:none;
    margin:0 0 20px;
    padding:14px 16px;
    background:rgba(255,122,26,0.06);
    border:1px solid var(--orange-dim);
    border-left:3px solid var(--orange);
    border-radius:4px;
  }
  .principles li{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:14.5px;
    color:var(--text);
    padding:4px 0;
  }
  .principles .p-num{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--orange);
    min-width:16px;
  }
  .subgroup-title{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--amber);
    margin-bottom:8px;
    font-weight:600;
    font-family:'Oswald',sans-serif;
  }

  .tech-list{list-style:none; margin:0; padding:0;}
  .tech-list li{margin-bottom:2px;}
  .tech-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-radius:4px;
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    background:var(--card);
    border:1px solid var(--line);
    margin-bottom:6px;
    cursor:pointer;
    transition:background .12s, color .12s, border-color .12s, padding-left .12s;
  }
  .tech-link:hover{
    background:var(--card-hover);
    border-color:var(--orange);
    padding-left:18px;
    color:var(--amber);
  }
  .play{
    width:20px;height:20px;min-width:20px;
    border-radius:50%;
    background:var(--orange-dim);
    display:flex;align-items:center;justify-content:center;
    color:#1a0e00;
    font-size:8px;
  }
  .tech-link:hover .play{background:var(--orange);}

  .empty-state{
    color:var(--text-faint);
    font-size:14px;
    padding:10px 0 20px;
    font-style:italic;
  }

  /* single position, single level: no card wrapper, plain content */
  .plain-wrap{padding:0;}

  footer{
    margin-top:40px;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    letter-spacing:.04em;
  }

  @media(max-width:640px){
    .wrap{padding:18px 14px 60px;}

    header{flex-direction:column; align-items:flex-start; gap:10px; margin-bottom:20px; padding-bottom:16px;}
    .header-meta{text-align:left; font-size:12px;}

    /* Scrollable tab strips instead of wrapping pills */
    .lvl-tabs, .pos-tabs{
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      margin-left:-14px;
      margin-right:-14px;
      padding-left:14px;
      padding-right:14px;
    }
    .lvl-tabs::-webkit-scrollbar, .pos-tabs::-webkit-scrollbar{display:none;}
    .lvl-tab, .pos-tab{flex:0 0 auto; white-space:nowrap;}
    .lvl-tab{padding:11px 16px; font-size:12.5px;}
    .pos-tab{padding:9px 14px; font-size:11.5px;}
    .pos-tabs{margin-bottom:22px; padding-bottom:16px;}

    .pos-block summary{padding:14px 14px;}
    .pos-block-body{padding:6px 12px 14px 14px;}
    .pos-block .num{width:24px;height:24px;min-width:24px;font-size:12px;}

    .principles{padding:12px 14px;}
    .principles li{font-size:14px;}

    .tech-link{padding:13px 14px; font-size:15px;}
    .subgroup{margin-bottom:16px;}

    footer{padding:0 14px; font-size:11px;}
  }

  @media(max-width:400px){
    h1{font-size:26px;}
    .brand-eyebrow{font-size:10.5px; letter-spacing:.16em;}
  }
</style>
</head>

function ytWatch(embedUrl){
  const id = embedUrl.split("/embed/")[1];
  return "https://www.youtube.com/watch?v=" + id;
}

let currentLvl = "Beginner";
let currentPos = "All"; // "All" or index into POSITIONS

function renderLvlTabs(){
  const wrap = document.getElementById('lvlTabs');
  wrap.innerHTML = '';
  LEVELS.forEach(lvl => {
    const btn = document.createElement('div');
    btn.className = 'lvl-tab' + (lvl === currentLvl ? ' active' : '');
    btn.textContent = lvl;
    btn.onclick = () => { currentLvl = lvl; renderContent(); renderLvlTabs(); };
    wrap.appendChild(btn);
  });
}

function renderPosTabs(){
  const wrap = document.getElementById('posTabs');
  wrap.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = 'pos-tab' + (currentPos === 'All' ? ' active' : '');
  allBtn.textContent = 'All Positions';
  allBtn.onclick = () => { currentPos = 'All'; renderContent(); renderPosTabs(); };
  wrap.appendChild(allBtn);

  POSITIONS.forEach((pos, i) => {
    const btn = document.createElement('div');
    btn.className = 'pos-tab' + (currentPos === i ? ' active' : '');
    btn.textContent = pos.title;
    btn.onclick = () => { currentPos = i; renderContent(); renderPosTabs(); };
    wrap.appendChild(btn);
  });
}

function buildPrinciples(principles, container){
  if(!principles || principles.length === 0) return;
  const ul = document.createElement('ul');
  ul.className = 'principles';
  principles.forEach((text, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="p-num">${i+1}.</span> <span>${text}</span>`;
    ul.appendChild(li);
  });
  container.appendChild(ul);
}

function buildGroups(groups, container){
  if(!groups || groups.length === 0){
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.textContent = 'No techniques listed here yet.';
    container.appendChild(e);
    return;
  }
  groups.forEach(group => {
    const g = document.createElement('div');
    g.className = 'subgroup';
    if(group.name){
      const gt = document.createElement('div');
      gt.className = 'subgroup-title';
      gt.textContent = group.name;
      g.appendChild(gt);
    }
    const ul = document.createElement('ul');
    ul.className = 'tech-list';
    group.items.forEach(([name, url]) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'tech-link';
      a.href = ytWatch(url);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span class="play">&#9654;</span> ${name}`;
      li.appendChild(a);
      ul.appendChild(li);
    });
    g.appendChild(ul);
    container.appendChild(g);
  });
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';

  const levelsToShow = currentLvl === 'All Levels' ? ["Beginner","Intermediate","Advanced"] : [currentLvl];
  const positionsToShow = currentPos === 'All'
    ? POSITIONS.map((p, i) => ({ ...p, idx: i }))
    : [{ ...POSITIONS[currentPos], idx: currentPos }];

  const multiPos = positionsToShow.length > 1;
  const multiLvl = levelsToShow.length > 1;

  positionsToShow.forEach((pos, blockIdx) => {
    let container;

    if(multiPos){
      const details = document.createElement('details');
      details.className = 'pos-block';
      if(blockIdx === 0) details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `<span class="num">${pos.idx + 1}</span> ${pos.title}`;
      details.appendChild(summary);
      const body = document.createElement('div');
      body.className = 'pos-block-body';
      details.appendChild(body);
      content.appendChild(details);
      container = body;
    } else {
      container = document.createElement('div');
      container.className = 'plain-wrap';
      content.appendChild(container);
    }

    buildPrinciples(pos.principles, container);

    levelsToShow.forEach(lvl => {
      if(multiLvl){
        const lt = document.createElement('div');
        lt.className = 'lvl-block-title';
        lt.textContent = lvl;
        container.appendChild(lt);
      }
      buildGroups(pos.levels[lvl], container);
    });
  });
}

renderLvlTabs();
renderPosTabs();
renderContent();
</script>

</body>
</html>
